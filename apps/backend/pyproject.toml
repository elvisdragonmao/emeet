[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant-backend"
version = "0.1.0"
description = "Self-hosted transcription backend for the meeting assistant capstone."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "websockets>=12,<16"
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0,<2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_backend*"]
