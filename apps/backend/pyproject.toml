[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emeet-backend"
version = "0.1.0"
description = "Self-hosted transcription backend for emeet."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "google-api-python-client>=2.0,<3",
    "google-auth>=2.0,<3",
    "google-auth-oauthlib>=1.0,<2",
    "uvicorn[standard]>=0.27,<1",
    "websockets>=12,<16"
]

[project.optional-dependencies]
faster-whisper = [
    "faster-whisper>=1.0,<2"
]
mlx-whisper = [
    "mlx-whisper>=0.4,<1; platform_system == 'Darwin' and platform_machine == 'arm64'"
]
browser = [
    "selenium>=4,<5"
]
stt = [
    "faster-whisper>=1.0,<2",
    "mlx-whisper>=0.4,<1; platform_system == 'Darwin' and platform_machine == 'arm64'"
]

[dependency-groups]
dev = [
    "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_backend*"]
