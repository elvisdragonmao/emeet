name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run backend tests
        run: python -m pytest

  slides:
    name: Slidev build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/slides

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install Slidev dependencies
        run: pnpm install --frozen-lockfile

      - name: Build slides
        run: pnpm build

  macos-app:
    name: macOS app build
    runs-on: macos-14

    defaults:
      run:
        working-directory: apps/macos/MeetingAssistantPrototype

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build app bundle
        run: ./Scripts/build-app.sh
